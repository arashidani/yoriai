openapi: 3.1.0
info:
  title: yoriai API
  version: 0.1.0
  description: yoriai バックエンド（Hono + Prisma + Supabase Auth）のAPI仕様書。認証は Supabase
    のセッションクッキーで行う。
servers:
  - url: /
    description: デフォルト
tags:
  - name: questions
    description: 質問（投稿）の閲覧・作成・削除、回答の投稿・一覧取得、解決済み操作
  - name: question-tags
    description: Q&Aの質問タグ候補
  - name: answers
    description: 回答へのいいね
  - name: hiroba
    description: ひろば（サブフォーラム）の一覧・詳細取得、投稿の作成（実名表示）
  - name: hiroba-posts
    description: ひろば投稿の取得・回答・いいね・保存・削除
  - name: hiroba-answers
    description: ひろば回答へのいいね
  - name: users
    description: ユーザー登録・自分のプロフィール取得
  - name: onboarding
    description: 初回プロフィール登録
  - name: admin
    description: 管理者専用のユーザー・投稿管理
  - name: invites
    description: 招待リンクの発行・確認
  - name: notifications
    description: 自分宛て通知の一覧取得・既読化・未読件数取得
  - name: password-resets
    description: パスワードリセットリンクの確認・実行
components:
  securitySchemes:
    supabaseSession:
      type: apiKey
      in: cookie
      name: sb-access-token
      description: "Supabase Auth のセッションクッキーによる認証。実際のクッキー名はSupabaseプロジェクトごとに異なる（例:
        sb-<project-ref>-auth-token）。"
  schemas:
    Question:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        status:
          type: string
          enum:
            - OPEN
            - RESOLVED
        answerCount:
          type: integer
          minimum: 0
        likeCount:
          type: integer
          minimum: 0
        liked:
          type: boolean
        saved:
          type: boolean
        isOwnQuestion:
          type: boolean
        displayAuthor:
          $ref: "#/components/schemas/QuestionDisplayAuthor"
        tag:
          anyOf:
            - $ref: "#/components/schemas/QuestionTag"
            - type: "null"
        resolvedAt:
          anyOf:
            - type: string
              format: date-time
              example: 2026-08-08T00:00:00.000Z
            - type: "null"
        createdAt:
          type: string
          format: date-time
          example: 2026-08-08T00:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-08-08T00:00:00.000Z
      required:
        - id
        - title
        - body
        - status
        - answerCount
        - likeCount
        - liked
        - saved
        - isOwnQuestion
        - displayAuthor
        - tag
        - resolvedAt
        - createdAt
        - updatedAt
    QuestionDisplayAuthor:
      type: object
      properties:
        displayName:
          type: string
          example: ねこ
        avatarUrl:
          type:
            - string
            - "null"
          example: /anonymous-profiles/cat.svg
      required:
        - displayName
        - avatarUrl
    QuestionTag:
      type: object
      properties:
        id:
          type: string
          example: tag-1
        name:
          type: string
          example: プロジェクト管理
      required:
        - id
        - name
    QuestionPagination:
      type: object
      properties:
        page:
          type: integer
          exclusiveMinimum: 0
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
        - page
        - pageSize
        - total
        - totalPages
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    QuestionAnswer:
      type: object
      properties:
        id:
          type: string
        questionId:
          type: string
        body:
          type: string
        likeCount:
          type: integer
          minimum: 0
        liked:
          type: boolean
        isOwnAnswer:
          type: boolean
        isMostLiked:
          type: boolean
          description: 募集終了済み質問の最多いいね回答1件だけtrue
        displayAuthor:
          $ref: "#/components/schemas/QuestionDisplayAuthor"
        createdAt:
          type: string
          format: date-time
          example: 2026-08-08T00:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-08-08T00:00:00.000Z
      required:
        - id
        - questionId
        - body
        - likeCount
        - liked
        - isOwnAnswer
        - isMostLiked
        - displayAuthor
        - createdAt
        - updatedAt
    ModerationResult:
      type: object
      properties:
        isHidden:
          type: boolean
          description: AI判定によって非公開になった場合はtrue
      required:
        - isHidden
    LikeStatus:
      type: object
      properties:
        liked:
          type: boolean
          example: true
        likeCount:
          type: number
          example: 1
      required:
        - liked
        - likeCount
    SavedStatus:
      type: object
      properties:
        saved:
          type: boolean
          example: true
      required:
        - saved
    QuestionTagCategory:
      type: object
      properties:
        id:
          type: string
          example: tag-category-1
        name:
          type: string
          example: 業務
        tags:
          type: array
          items:
            $ref: "#/components/schemas/QuestionTag"
      required:
        - id
        - name
        - tags
    ProfileOption:
      type: object
      properties:
        id:
          type: string
          example: option-1
        name:
          type: string
          example: 開発部
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - name
        - isActive
        - createdAt
        - updatedAt
    Hiroba:
      type: object
      properties:
        id:
          type: string
          example: hiroba-1
        slug:
          type: string
          example: hiroba-1
        name:
          type: string
          example: 広場１
        description:
          type: string
          example: みんなで気軽に話せる広場です。
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - slug
        - name
        - description
        - createdAt
    HirobaPost:
      type: object
      properties:
        id:
          type: string
          example: hiroba-post-1
        hirobaId:
          type: string
          example: hiroba-1
        title:
          type: string
          example: 今日のランチどこ行きました？
        body:
          type: string
          example: 近くに新しくできたお店に行ってみました。
        authorId:
          type:
            - string
            - "null"
          example: user-2
        author:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        answerCount:
          type: number
          example: 0
        likeCount:
          type: number
          example: 0
        deletedAt:
          anyOf:
            - type: string
              format: date-time
              example: 2024-01-01T00:00:00.000Z
            - type: "null"
          example: null
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
          example: []
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - hirobaId
        - title
        - body
        - authorId
        - answerCount
        - likeCount
        - deletedAt
        - createdAt
        - updatedAt
    User:
      type: object
      properties:
        id:
          type: string
          example: user-1
        supabaseId:
          type: string
          example: supabase-user-1
        email:
          type: string
          example: user@example.com
        name:
          type:
            - string
            - "null"
          example: 一般ユーザー
        username:
          type:
            - string
            - "null"
          example: あおさん
        displayNameColor:
          type:
            - string
            - "null"
          enum:
            - GREEN
            - YELLOW
            - BLUE
            - PURPLE
            - GRAY
            - null
          example: BLUE
        avatarUrl:
          type:
            - string
            - "null"
          example: https://xxxx.supabase.co/storage/v1/object/public/profiles/user-1.webp?v=1
        role:
          type: string
          enum:
            - USER
            - ADMIN
          example: USER
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - supabaseId
        - email
        - name
        - username
        - displayNameColor
        - avatarUrl
        - role
        - createdAt
    Tag:
      type: object
      properties:
        id:
          type: string
          example: tag-1
        name:
          type: string
          example: 経理
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - name
        - createdAt
    HirobaAnswer:
      type: object
      properties:
        id:
          type: string
          example: hiroba-answer-1
        hirobaPostId:
          type: string
          example: hiroba-post-1
        body:
          type: string
          example: いいですね、今度行ってみます！
        authorId:
          type:
            - string
            - "null"
          example: user-1
        author:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        isHidden:
          type: boolean
          example: false
        likeCount:
          type: number
          example: 0
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - hirobaPostId
        - body
        - authorId
        - isHidden
        - likeCount
        - createdAt
        - updatedAt
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
      required:
        - success
    InviteCreated:
      type: object
      properties:
        token:
          type: string
          example: a1b2c3...
        name:
          type:
            - string
            - "null"
          example: 山田 太郎（仮）
        role:
          type: string
          enum:
            - USER
            - ADMIN
          example: USER
        expiresAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - token
        - name
        - role
        - expiresAt
    InviteListItem:
      type: object
      properties:
        id:
          type: string
          example: invite-1
        name:
          type:
            - string
            - "null"
          example: 山田 太郎（仮）
        role:
          type: string
          enum:
            - USER
            - ADMIN
          example: USER
        status:
          type: string
          enum:
            - PENDING
            - USED
            - EXPIRED
          example: PENDING
        expiresAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - name
        - role
        - status
        - expiresAt
        - createdAt
    PasswordResetCreated:
      type: object
      properties:
        token:
          type: string
          example: a1b2c3...
        expiresAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - token
        - expiresAt
    Post:
      type: object
      properties:
        id:
          type: string
          example: post-1
        title:
          type: string
          example: Next.js App Routerの使い方を教えてください
        body:
          type: string
          example: App Router と Pages Router の違いが分かりません。
        authorId:
          type:
            - string
            - "null"
          example: user-2
        author:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        status:
          type: string
          enum:
            - OPEN
            - RESOLVED
            - HIDDEN
          example: OPEN
        answerCount:
          type: number
          example: 0
        likeCount:
          type: number
          example: 0
        resolvedAt:
          anyOf:
            - type: string
              format: date-time
              example: 2024-01-01T00:00:00.000Z
            - type: "null"
          example: null
        deletedAt:
          anyOf:
            - type: string
              format: date-time
              example: 2024-01-01T00:00:00.000Z
            - type: "null"
          example: null
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
          example: []
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - title
        - body
        - authorId
        - status
        - answerCount
        - likeCount
        - resolvedAt
        - deletedAt
        - createdAt
        - updatedAt
    Answer:
      type: object
      properties:
        id:
          type: string
          example: answer-1
        postId:
          type: string
          example: post-1
        body:
          type: string
          example: App Router を使うのがおすすめです。
        anonymousProfile:
          $ref: "#/components/schemas/AnonymousProfile"
        isHidden:
          type: boolean
          example: false
        likeCount:
          type: number
          example: 0
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - postId
        - body
        - anonymousProfile
        - isHidden
        - likeCount
        - createdAt
        - updatedAt
    AnonymousProfile:
      type: object
      properties:
        id:
          type: string
          example: anon-1
        displayName:
          type: string
          example: ねこ
        avatarUrl:
          type: string
          example: /anonymous-profiles/cat.svg
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - displayName
        - avatarUrl
    Badge:
      type: object
      properties:
        id:
          type: string
          example: badge-1
        name:
          type: string
          example: 初投稿
        description:
          type: string
          example: 初めて投稿を作成した
        icon:
          type: string
          example: Medal
        rarity:
          type: string
          enum:
            - BRONZE
            - SILVER
            - GOLD
            - PLATINUM
          example: BRONZE
        earnedCount:
          type: number
          example: 842
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - name
        - description
        - icon
        - rarity
        - earnedCount
        - createdAt
    Mission:
      type: object
      properties:
        id:
          type: string
          example: mission-1
        name:
          type: string
          example: 週に5件投稿
        description:
          type: string
          example: 1週間で5件の投稿を作成する
        durationLabel:
          type: string
          example: 1週間
        targetCount:
          type: number
          example: 5
        active:
          type: boolean
          example: true
        participantsCount:
          type: number
          example: 189
        progressPercent:
          type: number
          example: 62
        rewardBadgeId:
          type:
            - string
            - "null"
          example: badge-1
        rewardBadge:
          anyOf:
            - $ref: "#/components/schemas/Badge"
            - type: "null"
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - name
        - description
        - durationLabel
        - targetCount
        - active
        - participantsCount
        - progressPercent
        - rewardBadgeId
        - createdAt
    AiFlag:
      type: object
      properties:
        id:
          type: string
          example: flag-1
        title:
          type: string
          example: 攻撃的な表現を検出
        detail:
          type: string
          example: 投稿内に攻撃的な表現が含まれています
        severity:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
          example: HIGH
        status:
          type: string
          enum:
            - UNREAD
            - CONFIRMED
          example: UNREAD
        targetUserId:
          type:
            - string
            - "null"
          example: user-1
        targetUser:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        postId:
          type:
            - string
            - "null"
          example: post-1
        post:
          anyOf:
            - $ref: "#/components/schemas/Post"
            - type: "null"
        answerId:
          type:
            - string
            - "null"
          example: null
        answer:
          anyOf:
            - $ref: "#/components/schemas/Answer"
            - type: "null"
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - title
        - detail
        - severity
        - status
        - targetUserId
        - postId
        - answerId
        - createdAt
    TagCategory:
      type: object
      properties:
        id:
          type: string
          example: tag-category-1
        name:
          type: string
          example: 人事
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - name
        - createdAt
    AdminTag:
      type: object
      properties:
        id:
          type: string
          example: tag-1
        name:
          type: string
          example: 給与
        category:
          type: string
          example: 人事
        description:
          type:
            - string
            - "null"
          example: 給与計算、給与明細、控除に関する投稿に使用します。
        isWorkTag:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - name
        - category
        - description
        - isWorkTag
        - createdAt
    UserProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            departmentId:
              type:
                - string
                - "null"
              example: department-1
            businessAreaId:
              type:
                - string
                - "null"
              example: business-area-1
            joinedYear:
              type:
                - integer
                - "null"
              example: 2024
            joinedMonth:
              type:
                - integer
                - "null"
              example: 4
            businessSkillIds:
              type: array
              items:
                type: string
              example:
                - business-skill-1
            interestIds:
              type: array
              items:
                type: string
              example:
                - interest-1
            lunchPreference:
              type:
                - string
                - "null"
              enum:
                - NO_PREFERENCE
                - TEAM
                - ALONE
                - null
              example: TEAM
            recommendedLunchSpot:
              type:
                - string
                - "null"
              example: 駅前食堂
            bio:
              type:
                - string
                - "null"
              example: よろしくお願いします
          required:
            - departmentId
            - businessAreaId
            - joinedYear
            - joinedMonth
            - businessSkillIds
            - interestIds
            - lunchPreference
            - recommendedLunchSpot
            - bio
    Invite:
      type: object
      properties:
        name:
          type:
            - string
            - "null"
          example: 山田 太郎（仮）
        role:
          type: string
          enum:
            - USER
            - ADMIN
          example: USER
      required:
        - name
        - role
    Notification:
      type: object
      properties:
        id:
          type: string
          example: notification-1
        userId:
          type: string
          example: user-1
        type:
          $ref: "#/components/schemas/NotificationType"
        postId:
          type:
            - string
            - "null"
          example: post-1
        post:
          anyOf:
            - $ref: "#/components/schemas/Post"
            - type: "null"
        answerId:
          type:
            - string
            - "null"
          example: null
        answer:
          anyOf:
            - $ref: "#/components/schemas/Answer"
            - type: "null"
        isRead:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
      required:
        - id
        - userId
        - type
        - postId
        - answerId
        - isRead
        - createdAt
    NotificationType:
      type: string
      enum:
        - POST_ANSWERED
        - POST_DELETED
        - ANSWER_HIDDEN
    UnreadNotificationCount:
      type: object
      properties:
        count:
          type: integer
          example: 3
      required:
        - count
  parameters: {}
paths:
  /api/questions:
    get:
      tags:
        - questions
      summary: 質問一覧を検索・絞り込み・ページングして取得
      security: &a1
        - supabaseSession: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            example: 10
          required: false
          name: pageSize
          in: query
        - schema:
            type: string
            maxLength: 100
          required: false
          name: keyword
          in: query
        - schema:
            type: string
            enum:
              - all
              - unanswered
              - resolved
            default: all
          required: false
          name: status
          in: query
        - schema:
            type: string
          required: false
          name: tagId
          in: query
        - schema:
            type: string
            example: tag-category-1,tag-category-2
          required: false
          name: categoryIds
          in: query
        - schema:
            type: string
            example: tag-1,tag-2
          required: false
          name: tagIds
          in: query
      responses:
        "200":
          description: 質問一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
